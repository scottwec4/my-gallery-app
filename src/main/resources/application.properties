# The name of your application.
spring.application.name=warehouse-api

# --- How to reach the database ---
# The last part of the URL (warehousedb) is the database name. Create it once in
# pgAdmin (CREATE DATABASE warehousedb;) before you run the app the first time.
spring.datasource.url=jdbc:postgresql://localhost:5432/warehousedb
spring.datasource.username=postgres
spring.datasource.password=postgres

# --- What Hibernate should do with your tables ---
# "update" looks at your entity classes and creates or adjusts the tables to
# match them. Your data survives a restart.
spring.jpa.hibernate.ddl-auto=update

# Prints the SQL Hibernate generates to the console - handy while learning.
spring.jpa.show-sql=true

# --- Security (Phase 5): the key used to sign JWTs, and how long a token stays
# valid (1 hour). In a real app this secret lives in an environment variable,
# not in the file. The users table is created for you.
jwt.secret=9f8b2c7e4a1d6f30b85c2e91a47d6f08c3b1e25a9d4f78c206e1b3a5d8f0c2e74
jwt.expiration-ms=3600000

# Change the interactive UI access path (Default is /swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html

# Change the raw JSON documentation api data path (Default is /v3/api-docs)
springdoc.api-docs.path=/v3/api-docs

#Cloudflare r2 secrets
r2.access-key-id: ${R2_ACCESS_KEY_ID}
r2.secret-access-key: ${R2_SECRET_ACCESS_KEY}
r2.account-id: ${R2_ACCOUNT_ID}
r2.bucket: ${R2_BUCKET_NAME}



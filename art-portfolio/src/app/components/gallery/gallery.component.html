<div class="min-h-screen bg-[#807d77] text-white font-serif flex flex-col w-full antialiased select-none">

  <app-header class="w-full"></app-header>

  <div class="w-full bg-[#96928a] border-b border-[#6e6b66] py-2 px-6 flex justify-center space-x-6 text-sm tracking-wide">
    @for (cat of subCategories; track cat) {
      <button
        (click)="selectCategory(cat)"
        [class.text-[#c3e0b4]]="selectedCategory === cat"
        [class.text-white]="selectedCategory !== cat"
        class="capitalize hover:text-[#c3e0b4] transition-colors duration-200 cursor-pointer font-sans font-medium">
        {{ cat }}
      </button>
    }
  </div>

  <main class="w-full max-w-7xl mx-auto px-6 py-12 flex-grow">

    <app-gallery-showcase [items]="(filteredGallery$ | async) ?? []"></app-gallery-showcase>

  </main>
</div>
